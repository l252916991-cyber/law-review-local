name: LexVault offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      LAW_REVIEW_AUTH_MODE: local
      LAW_REVIEW_LLM_URL: http://127.0.0.1:1/v1
      REDIS_URL: redis://127.0.0.1:1/0
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.0
          uv sync --locked --group dev --python "$(command -v python)"
          uv pip check
      - name: Verify requirements export stays synchronized
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          diff requirements.txt "$RUNNER_TEMP/requirements.txt"
          uv export --locked --all-groups --no-emit-project --no-header --format requirements-txt --output-file "$RUNNER_TEMP/requirements-dev.txt"
          diff requirements-dev.txt "$RUNNER_TEMP/requirements-dev.txt"
      - name: Environment and static checks
        run: |
          export LAW_REVIEW_DATA_DIR="$RUNNER_TEMP/lexvault-data" LAW_REVIEW_LANGGRAPH_CHECKPOINT_DB="$RUNNER_TEMP/lexvault-data/checkpoints.sqlite"
          uv run --locked python scripts/doctor.py
          uv run --locked python -m compileall -q app tests scripts
          uv run --locked ruff check app tests scripts
          uv run --locked mypy
          for script in app/static/*.js; do node --check "$script"; done
      - name: Offline tests with actual reports
        run: |
          export LAW_REVIEW_DATA_DIR="$RUNNER_TEMP/lexvault-data" LAW_REVIEW_LANGGRAPH_CHECKPOINT_DB="$RUNNER_TEMP/lexvault-data/checkpoints.sqlite"
          mkdir -p output/ci
          set -o pipefail
          uv run --locked pytest tests scripts/test_engineering.py scripts/test_data_snapshot.py scripts/test_snapshot_runtime.py \
            -p pytest_cov -p pytest_socket --disable-socket --allow-unix-socket \
            --junitxml=output/ci/junit.xml --cov=app --cov-branch \
            --cov-report=term-missing --cov-report=xml:output/ci/coverage.xml \
            --cov-report=json:output/ci/coverage.json --cov-report=html:output/ci/htmlcov \
            2>&1 | tee output/ci/pytest.log
      - name: Validate release allowlist
        run: uv run --locked python scripts/package_release.py --dry-run > output/ci/release-manifest.json
      - name: Upload test evidence (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-results-python-${{ matrix.python-version }}
          path: output/ci/
          if-no-files-found: warn
          retention-days: 14
