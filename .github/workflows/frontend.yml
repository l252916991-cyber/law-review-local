name: LexVault frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LAW_REVIEW_LLM_URL: http://127.0.0.1:1/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked tools and dependencies
        run: |
          npm install --global pnpm@11.25.0
          python -m pip install uv==0.12.0
          uv sync --locked --group dev
          pnpm --dir frontend install --frozen-lockfile
      - name: Verify API contract and frontend
        working-directory: frontend
        run: |
          pnpm contract:check
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm build:static
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit
      - name: Install test browser and verify real page flows
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
