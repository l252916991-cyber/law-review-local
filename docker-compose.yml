# LexVault local deployment: one Web process, one queue worker, Redis.
# The LLM/embedding service is external (LAW_REVIEW_LLM_URL / LAW_REVIEW_EMBEDDING_URL);
# configure them to a loopback-side or approved https endpoint per docs/runbook.
#
# Secrets: create a .env file from .env.example and set LAW_REVIEW_API_TOKENS_JSON
# there. The compose file reads it but never bakes secrets into images.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    image: lexvault-local
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      LAW_REVIEW_ALLOWED_HOSTS: ${LAW_REVIEW_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LAW_REVIEW_LOCAL_MODEL_HOSTS: host.docker.internal
      LAW_REVIEW_TRUSTED_LOCAL_PEERS: ${LAW_REVIEW_TRUSTED_LOCAL_PEERS:-172.18.0.1}
    volumes:
      - web-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: lexvault-local
    build: .
    command: ["/opt/lexvault-venv/bin/arq", "app.tasks.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      LAW_REVIEW_LOCAL_MODEL_HOSTS: host.docker.internal
    volumes:
      - web-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/lexvault-venv/bin/python", "-c", "import redis; assert redis.Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  web-data:
  redis-data:
