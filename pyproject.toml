[project]
name = "lexvault-local"
version = "0.1.0"
description = "Local-first legal document review with native DAG and LangGraph runtimes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.136,<1",
  "uvicorn>=0.49,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "arq>=0.25,<1",
  "redis>=5,<7",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "jieba>=0.42.1,<1",
  "cn2an>=0.5.23,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "coverage[toml]>=7.9,<8",
  "httpx>=0.28,<1",
  "fakeredis>=2.28,<3",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "pre-commit>=4,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# Fatal syntax/name errors are enforced across maintained code. Style migration is separate.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["huggingface_hub.*"]
ignore_missing_imports = true
