[project]
name = "lexvault-local"
version = "0.3.0"
description = "Local-first legal document review with native DAG and LangGraph runtimes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.136,<1",
  "uvicorn>=0.49,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "arq>=0.25,<1",
  "redis>=5,<7",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "jieba>=0.42.1,<1",
  "cn2an>=0.5.23,<1",
  "pyjwt[crypto]>=2.13.0",
  "openpyxl>=3.1.5,<4",
  "xlrd==2.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "coverage[toml]>=7.9,<8",
  "httpx>=0.28,<1",
  "fakeredis>=2.28,<3",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "pre-commit>=4,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# Fatal syntax errors plus the full Pyflakes set (unused/undefined names, dead
# assignments, redefinitions). Further style families are enabled one at a time.
select = ["E9", "F", "I", "UP", "B"]
ignore = [
  # zip() truncation is relied on in existing scoring/report code; making every
  # call strict needs a per-site review and is tracked separately.
  "B905",
  # Reviewed 2026-11-01: every flagged closure is called within the same loop
  # iteration (row parsers, per-round worker threads joined before the next round).
  "B023",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported from sibling test modules and injected by name;
# the parameter that receives them is reported as a redefinition.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["huggingface_hub.*"]
ignore_missing_imports = true
